services:
  guacd:
    image: guacamole/guacd:1.5.0
    container_name: rdp-guacd
    restart: unless-stopped
    ports:
      - "4822:4822"
    environment:
      - GUACD_LOG_LEVEL=info

  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    container_name: rdp-server-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_URL=file:./data/app.db
      - JWT_ACCESS_SECRET=rdp-access-token-secret-key-32chars
      - JWT_REFRESH_SECRET=rdp-refresh-token-secret-key-32chars
      - VM_ENCRYPTION_KEY=rdp-vm-encryption-key-32bytes-secret!
      - ENCRYPTION_KEY=rdp-vm-encryption-key-32bytes-secret!
      - GUACD_HOST=guacd
      - GUACD_PORT=4822
      - CORS_ORIGIN=http://localhost:5173
    volumes:
      - ./server/data:/app/server/data
    depends_on:
      - guacd

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: rdp-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

  rdp-server:
    build:
      context: ./test-rdp
    container_name: test-rdp
    restart: unless-stopped
    environment:
      RDP_USERNAME: testuser
      RDP_PASSWORD: testpass
      TZ: Asia/Kolkata
    ports:
      - "3389:3389"
    shm_size: "1gb"
